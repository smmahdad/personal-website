<VirtualHost *:80>
    ServerName sammah.dad
    ServerAlias www.sammah.dad
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://192.168.0.137:8082/
    ProxyPassReverse / http://192.168.0.137:8082/
    ErrorLog  ${APACHE_LOG_DIR}/sammah_dad_error.log
    CustomLog ${APACHE_LOG_DIR}/sammah_dad_access.log combined
</VirtualHost>
