<VirtualHost *:443>
    ServerName sammah.dad
    ServerAlias www.sammah.dad
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sammah.dad/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sammah.dad/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyAddHeaders On
    ProxyPass        / http://192.168.0.137:8082/
    ProxyPassReverse / http://192.168.0.137:8082/
    ErrorLog  ${APACHE_LOG_DIR}/sammah_dad_error.log
    CustomLog ${APACHE_LOG_DIR}/sammah_dad_access.log combined
</VirtualHost>
